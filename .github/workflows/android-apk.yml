name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: artifacts/download-max
        run: pnpm install --no-frozen-lockfile --ignore-workspace

      - name: Generate Android project
        working-directory: artifacts/download-max
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: artifacts/download-max/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: download-max-debug-apk
          path: artifacts/download-max/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

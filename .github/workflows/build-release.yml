name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/download-max

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # مجلد android/ يُنشأ لاحقاً بواسطة expo prebuild، لذا نستخدم مفتاحاً ثابتاً
      # مع restore-keys بدل hashFiles على ملفات غير موجودة بعد.
      - name: Cache Gradle wrapper & dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-v1
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install required Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo prebuild (android)
        run: pnpm exec expo prebuild --platform android --clean --no-install

      # حصر المعماريات بعد الـ prebuild: arm64-v8a (كل الهواتف الحديثة 2016+)
      # + x86_64 (محاكيات فقط). reactNativeArchitectures هو الطريقة الرسمية
      # في React Native لحصر المعماريات (يشمل كل مكتبات native مثل ffmpeg-kit
      # و webview) — نتجنب تعديل build.gradle يدوياً الذي قد يكسر إعدادات Expo.
      - name: Pin Android ABIs (arm64-v8a + x86_64)
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' android/gradle.properties
          grep -E "^reactNativeArchitectures=" android/gradle.properties

      - name: Build release APK
        working-directory: artifacts/download-max/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: artifacts/download-max/android/app/build/outputs/apk/release/*.apk
